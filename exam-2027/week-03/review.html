<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>W3｜15 分鐘複習</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#233c34;font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}main{max-width:920px;margin:auto;padding:28px 16px 72px}h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}.muted{color:#587064}.card{padding:22px;margin:18px 0;border:1px solid #dae5de;border-radius:18px;background:white}.row{display:flex;flex-wrap:wrap;gap:10px}button{cursor:pointer;border:1px solid #aec9bb;border-radius:9px;background:white;color:#205943;padding:10px 14px;font:inherit}.active,.primary{background:#205943;color:white}.choice{display:block;text-align:left;width:100%;margin:7px 0}.choice[aria-pressed=true]{background:#dfefe7}.q{padding:14px 0;border-bottom:1px solid #dce9e0}.chip{display:inline-block;background:#e6f1ea;border-radius:30px;padding:5px 12px;margin:4px}.read{background:#f5faf6;padding:15px;border-radius:9px;line-height:1.85}textarea{width:100%;min-height:135px;border:1px solid #b5cbbf;border-radius:10px;padding:12px;font:inherit}a{color:#23664b}.good{color:green}.bad{color:#a33}.small{font-size:13px}</style></head><body><main><div class="muted small">ENGLISH TUTOR · EXAM 2027</div><h1>Week 3｜15 分鐘課後複習</h1><p>5 題單字／文章理解＋3 題句型應用。建議 3 分鐘回想、8 分鐘作答、4 分鐘訂正。</p><div class="card"><div class="row"><button id="tab0">W3-1</button><button id="tab1">W3-2</button></div><h2 id="title"></h2></div><div class="card"><h2>課後測驗</h2><div id="quiz"></div><div class="row"><button class="primary" id="grade">批改與解析</button><button id="reset">重新作答</button></div><strong id="score" aria-live="polite"></strong></div><div class="card"><h2>錯題筆記區</h2><textarea id="notes" placeholder="記下不熟的單字、規則或老師補充的例句"></textarea><p class="muted small">此瀏覽器自動保存，不會自動傳給老師。</p><button id="copy">複製筆記及結果</button></div><p><a href="index.html">← 返回本週上課教材</a></p></main><script>const W=3,REVIEW=true,DATA=[["Conjunctions","tzohzyy3x6fhzb4","連接詞、邏輯關係",["although","unless","however","therefore","whether"],["because + S + V；because of + N。","although + 子句；避免與 but 重複。","as soon as 未來時間子句通常用現在式。"],"Leo wanted to join the basketball team, but he was not confident. Although he practiced every week, he was nervous. His coach encouraged him, so he kept trying. He improved as long as he practiced consistently.",[["It was late, ___ we left.",["so","but","although"],0,"結果"],["It rained, ___ we went out.",["but","because","so"],0,"轉折"],["We stayed home ___ it was raining.",["because","because of","despite"],0,"because + 子句"],["We stayed home ___ the rain.",["because of","because","although"],0,"because of + N"],["___ she was tired, she studied.",["Although","Despite","Because of"],0,"Although + 子句"],["You cannot enter ___ you have a ticket.",["unless","and","so"],0,"unless"],["I will call you when I ___ home.",["arrive","will arrive","arrived yesterday"],0,"時間子句用現在式"],["She likes both reading and ___.",["drawing","to draw","draws"],0,"平行結構"]]],["Prepositions","0kj34r74i0po2na","時間、地點、方向與方法",["deadline","appointment","entrance","tunnel","equipment"],["介系詞後接名詞、代名詞或 V-ing。","by + 期限；until + 持續至。","during + N；while + S + V。"],"The group had an appointment at the station on Friday. They needed to finish a report by noon. During the meeting, they discussed a route through a tunnel. They improved their presentation by practicing with new equipment.",[["The report has a ___ Friday.",["deadline","tunnel","equipment"],0,"deadline"],["I have an ___ at 3 p.m.",["appointment","entrance","equipment"],0,"appointment"],["Meet me at the ___.",["entrance","tunnelled","deadline"],0,"entrance"],["The train went through a ___.",["tunnel","appointment","equipment"],0,"tunnel"],["They used new ___.",["equipment","equipments","equip"],0,"equipment 不可數"],["Finish the task ___ Friday.",["by","until","during"],0,"期限"],["We talked ___ the meeting.",["during","while","until"],0,"during + N"],["She learned by ___ daily.",["practicing","practice","practiced"],0,"by + V-ing"]]]];let ix=0,$=id=>document.getElementById(id),storage=j=>'exam2027-week-'+W+'-'+(REVIEW?'review-':'lesson-')+j,state=[0,1].map(j=>{try{return JSON.parse(localStorage.getItem(storage(j)))||'{"a":{},"notes":"","graded":false}')}catch{return {a:{},notes:'',graded:false}}});function save(){state[ix].notes=$('notes').value;try{localStorage.setItem(storage(ix),JSON.stringify(state[ix]))}catch{}}function draw(){const d=DATA[ix],s=state[ix];$('tab0').classList.toggle('active',ix===0);$('tab1').classList.toggle('active',ix===1);$('title').textContent=d[0];$('notes').value=s.notes;if(!REVIEW){$('canva').href='https://canva.link/'+d[1];$('topic').textContent=d[2];$('vocab').replaceChildren();d[3].forEach(x=>{let el=document.createElement('span');el.className='chip';el.textContent=x;$('vocab').append(el)});$('rules').replaceChildren();d[4].forEach(x=>{let li=document.createElement('li');li.textContent=x;$('rules').append(li)});$('reading').textContent=d[5]}$('quiz').replaceChildren();d[6].forEach((q,i)=>{let sec=document.createElement('section');sec.className='q';let head=document.createElement('strong');head.textContent=(i+1)+'. '+q[0];sec.append(head);q[1].forEach((op,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+op;b.setAttribute('aria-pressed',String(s.a[i]===j));b.onclick=()=>{if(s.graded)return;s.a[i]=j;save();draw()};sec.append(b)});if(s.graded){let p=document.createElement('p');p.className=s.a[i]===q[2]?'good':'bad';p.textContent=(s.a[i]===q[2]?'✓ 正確':'✗ 正解：'+String.fromCharCode(65+q[2]))+'。'+q[3];sec.append(p)}$('quiz').append(sec)});$('grade').disabled=!!s.graded;$('score').textContent=s.graded?'得分：'+d[6].filter((q,i)=>s.a[i]===q[2]).length+'/8':''}for(let i=0;i<2;i++)$('tab'+i).onclick=()=>{ix=i;draw()};$('grade').onclick=()=>{if(Object.keys(state[ix].a).length<8){$('score').textContent='請先完成全部 8 題';return}state[ix].graded=true;save();draw()};$('reset').onclick=()=>{if(!confirm('重新作答？筆記保留。'))return;state[ix].a={};state[ix].graded=false;save();draw()};$('notes').oninput=save;$('copy').onclick=()=>{let t='W'+W+'-'+(ix+1)+' '+$('score').textContent+'\n'+$('notes').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(()=>prompt('請複製',t));else prompt('請複製',t)};draw();</script></body></html>
