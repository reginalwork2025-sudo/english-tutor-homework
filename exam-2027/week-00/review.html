<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>W0｜15 分鐘複習</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#233c34;font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}main{max-width:920px;margin:auto;padding:28px 16px 72px}h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}.muted{color:#587064}.card{padding:22px;margin:18px 0;border:1px solid #dae5de;border-radius:18px;background:white}.row{display:flex;flex-wrap:wrap;gap:10px}button{cursor:pointer;border:1px solid #aec9bb;border-radius:9px;background:white;color:#205943;padding:10px 14px;font:inherit}.active,.primary{background:#205943;color:white}.choice{display:block;text-align:left;width:100%;margin:7px 0}.choice[aria-pressed=true]{background:#dfefe7}.q{padding:14px 0;border-bottom:1px solid #dce9e0}.chip{display:inline-block;background:#e6f1ea;border-radius:30px;padding:5px 12px;margin:4px}.read{background:#f5faf6;padding:15px;border-radius:9px;line-height:1.85}textarea{width:100%;min-height:135px;border:1px solid #b5cbbf;border-radius:10px;padding:12px;font:inherit}a{color:#23664b}.good{color:green}.bad{color:#a33}.small{font-size:13px}</style></head><body><main><div class="muted small">ENGLISH TUTOR · EXAM 2027</div><h1>Week 0｜15 分鐘課後複習</h1><p>5 題單字／文章理解＋3 題句型應用。建議 3 分鐘回想、8 分鐘作答、4 分鐘訂正。</p><div class="card"><div class="row"><button id="tab0">W0-1</button><button id="tab1">W0-2</button></div><h2 id="title"></h2></div><div class="card"><h2>課後測驗</h2><div id="quiz"></div><div class="row"><button class="primary" id="grade">批改與解析</button><button id="reset">重新作答</button></div><strong id="score" aria-live="polite"></strong></div><div class="card"><h2>錯題筆記區</h2><textarea id="notes" placeholder="記下不熟的單字、規則或老師補充的例句"></textarea><p class="muted small">此瀏覽器自動保存，不會自動傳給老師。</p><button id="copy">複製筆記及結果</button></div><p><a href="index.html">← 返回本週上課教材</a></p></main><script>const W=0,REVIEW=true,DATA=[["Wait! Don’t Eat That!","409kh0h8cva77nq","SVO、SVC 與故事閱讀",["babysit","active","crayon","hungry","inside"],["S + V：They stayed.","S + V + O：Emma watched Toby.","S + be + C：Toby was active."],"Emma babysat Toby, a five-year-old boy. Toby was friendly but very active. He picked up a crayon because it looked like candy. Emma stopped him. It was raining, so they stayed inside. Later Toby wanted chocolate, but Emma gave him an apple instead.",[["Toby was ___",["active","actively","activity"],0,"be 後可接形容詞"],["Emma ___ Toby.",["watched","watching","watch"],0,"過去事件"],["Toby picked up a ___.",["crayon","medal","track"],0,"故事中是蠟筆"],["The boy became ___.",["hungry","hunger","hungrily"],0,"became 後接形容詞"],["They stayed ___ because it rained.",["inside","outside","garden"],0,"因下雨留在室內"],["Emma ___ him an apple.",["gave","give","giving"],0,"過去式 gave"],["What did Toby want to eat?",["Chocolate","Books","Sandwiches"],0,"Toby 想吃巧克力"],["Which is S + V + O?",["Emma watched Toby.","Toby was active.","They stayed."],0,"Emma(S) watched(V) Toby(O)"]]],["Plans, Problems and Unexpected Events","27cjyztfuimdul8","過去式與動詞辨認",["marathon","registration","stretch","oversleep","soaked"],["be 動詞與一般動詞不同。","Did + 主詞 + 原形動詞？","oversleep → overslept；run → ran。"],"Joe and Diane planned to join a mountain marathon in Hualien. The race was 24 kilometers long, and runners would pass fields of golden flowers. Alice had a terrible morning. Her alarm did not ring, so she overslept. She ran for the bus and got soaked in the rain.",[["Runners should ___ before a race.",["stretch","stretched","stretching"],0,"should + 原形"],["Race ___ is open.",["registration","register","registered"],0,"需要名詞"],["Alice ___ because her alarm did not ring.",["overslept","oversleep","oversleeping"],0,"過去式"],["She got completely ___.",["soaked","stretch","registration"],0,"get soaked"],["Joe joined a ___.",["marathon","crayon","sandwich"],0,"馬拉松"],["She ___ to the bus stop yesterday.",["ran","run","running"],0,"run 的過去式"],["Did Alice ___ the bus?",["miss","missed","missing"],0,"did + 原形"],["How long was the race?",["24 kilometers","3 kilometers","150 kilometers"],0,"24 km"]]]];let ix=0,$=id=>document.getElementById(id),storage=j=>'exam2027-week-'+W+'-'+(REVIEW?'review-':'lesson-')+j,state=[0,1].map(j=>{try{return JSON.parse(localStorage.getItem(storage(j)))||'{"a":{},"notes":"","graded":false}')}catch{return {a:{},notes:'',graded:false}}});function save(){state[ix].notes=$('notes').value;try{localStorage.setItem(storage(ix),JSON.stringify(state[ix]))}catch{}}function draw(){const d=DATA[ix],s=state[ix];$('tab0').classList.toggle('active',ix===0);$('tab1').classList.toggle('active',ix===1);$('title').textContent=d[0];$('notes').value=s.notes;if(!REVIEW){$('canva').href='https://canva.link/'+d[1];$('topic').textContent=d[2];$('vocab').replaceChildren();d[3].forEach(x=>{let el=document.createElement('span');el.className='chip';el.textContent=x;$('vocab').append(el)});$('rules').replaceChildren();d[4].forEach(x=>{let li=document.createElement('li');li.textContent=x;$('rules').append(li)});$('reading').textContent=d[5]}$('quiz').replaceChildren();d[6].forEach((q,i)=>{let sec=document.createElement('section');sec.className='q';let head=document.createElement('strong');head.textContent=(i+1)+'. '+q[0];sec.append(head);q[1].forEach((op,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+op;b.setAttribute('aria-pressed',String(s.a[i]===j));b.onclick=()=>{if(s.graded)return;s.a[i]=j;save();draw()};sec.append(b)});if(s.graded){let p=document.createElement('p');p.className=s.a[i]===q[2]?'good':'bad';p.textContent=(s.a[i]===q[2]?'✓ 正確':'✗ 正解：'+String.fromCharCode(65+q[2]))+'。'+q[3];sec.append(p)}$('quiz').append(sec)});$('grade').disabled=!!s.graded;$('score').textContent=s.graded?'得分：'+d[6].filter((q,i)=>s.a[i]===q[2]).length+'/8':''}for(let i=0;i<2;i++)$('tab'+i).onclick=()=>{ix=i;draw()};$('grade').onclick=()=>{if(Object.keys(state[ix].a).length<8){$('score').textContent='請先完成全部 8 題';return}state[ix].graded=true;save();draw()};$('reset').onclick=()=>{if(!confirm('重新作答？筆記保留。'))return;state[ix].a={};state[ix].graded=false;save();draw()};$('notes').oninput=save;$('copy').onclick=()=>{let t='W'+W+'-'+(ix+1)+' '+$('score').textContent+'\n'+$('notes').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(()=>prompt('請複製',t));else prompt('請複製',t)};draw();</script></body></html>
