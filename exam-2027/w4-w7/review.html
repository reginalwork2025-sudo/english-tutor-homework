<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學測英文｜15 分鐘課後複習</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#18372f;background:#f2f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(26px,5vw,38px)}h2{font-size:20px}p{line-height:1.6}.muted{color:#526861}.panel{background:#fff;border:1px solid #d4e0d8;border-radius:16px;padding:20px;margin-top:16px}select,button{font:inherit;border:1px solid #a9c0b1;border-radius:10px;padding:10px 14px;background:white;color:#18372f}select{max-width:100%;width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c29142;outline-offset:2px}.option{display:block;width:100%;text-align:left;margin:8px 0}.chosen{border-color:#24644d;background:#e8f4ea}.primary{background:#205a44;color:white}#outcome{border-top:1px solid #d4e0d8;margin-top:16px;padding-top:16px}.good{color:#186a41}.warn{color:#9b4c13}.small{font-size:13px}summary{cursor:pointer}#status{font-weight:700}@media(max-width:500px){.panel{padding:16px}}</style></head><body><main>
<p class="muted">2027 學測英文 · W4–W7</p><h1>15 分鐘課後複習</h1><p class="muted">每堂 5 題單字＋3 題規則，共 8 題。可重做；本頁不會自動傳送成績給老師。請截圖回報。</p>
<div class="panel"><label for="lesson">選擇今天的課程</label><select id="lesson"></select><p><button id="start" class="primary">開始／重新測驗</button></p><p id="status" aria-live="polite"></p></div>
<section class="panel" id="area" hidden><h2 id="heading"></h2><p id="question"></p><div id="answers"></div><button id="next" class="primary" disabled>下一題</button></section>
<section class="panel" id="outcome" hidden><h2>複習結果</h2><p id="grade"></p><p id="advice"></p><details><summary>檢查答案與錯題</summary><div id="details"></div></details><p><button id="copy">複製成績文字</button></p></section><p class="small muted">題目為原創練習；分數儲存在本次作答頁面，不建立帳號或上傳資料。建議下次課先重做錯題。</p></main>
<script>
'use strict';
const LESSONS=[{"t":"W4-1 詞彙題","v":[["improve","改善","拒絕","等待"],["method","方法","危險","理由"],["similar","相似的","緩慢的","困難的"],["reduce","減少","加入","報告"],["notice","注意到","相信","購買"]],"r":[["The teacher tried a new ___.","method","similar","reduce"],["We can ___ our reading speed by practising.","improve","method","similar"],["These two stories are ___.","similar","reduce","notice"]]},{"t":"W4-2 綜合測驗","v":[["however","然而","因此","例如"],["therefore","因此","雖然","同時"],["instead","作為替代","因為","直到"],["although","雖然","除非","直到"],["refer","指涉","降低","蒐集"]],"r":[["I was tired; ___, I finished the homework.","however","therefore","instead"],["She practised daily; ___, her reading improved.","therefore","although","however"],["In 'This surprised him', 'This' can refer to ___.","the previous result","only a person","a future event"]]},{"t":"W5-1 文意選填Ⅰ","v":[["available","可取得的","危險的","立即的"],["provide","提供","缺席","減少"],["effect","影響（名詞）","方法","條件"],["local","當地的","昂貴的","以前的"],["experience","經驗","結果","比賽"]],"r":[["The room is ___ after school.","available","provide","effect"],["Volunteers ___ books.","provide","effect","local"],["The project had a positive ___ on the town.","effect","available","provide"]]},{"t":"W5-2 文意選填Ⅱ","v":[["decision","決定","文章","原因"],["increase","增加","減少","拒絕"],["support","支持","避免","離開"],["opportunity","機會","態度","問題"],["challenge","挑戰","規則","結論"]],"r":[["We have an ___ to join the club.","opportunity","decision","increase"],["The principal made a ___.","decision","support","increase"],["Students ___ one another.","support","challenge","opportunity"]]},{"t":"W6-1 篇章結構Ⅰ","v":[["organize","組織","比較","儲存"],["participant","參加者","發明","機會"],["collect","收集","刪除","忘記"],["community","社區","裝置","過程"],["result","結果","原因","標題"]],"r":[["'This result' needs ___.","a previous event or outcome","a new unrelated topic","no context"],["They invited neighbors. ___, more people joined.","As a result","However","For example"],["Which follows 'At first, they collected bottles' naturally?","Later, they found other trash.","The sun is a star.","I ate breakfast."]]},{"t":"W6-2 篇章結構Ⅱ","v":[["benefit","好處","限制","長度"],["reason","原因","結果","需求"],["example","例子","條件","答覆"],["continue","繼續","拒絕","比較"],["convenient","方便的","昂貴的","緊張的"]],"r":[["Online learning is convenient. ___, it can be distracting.","However","Therefore","For example"],["Students may get distracted. ___, they check messages.","For example","Therefore","Although"],["Teachers use short quizzes. ___, they can check understanding.","Therefore","However","Instead"]]},{"t":"W7-1 閱讀測驗Ⅰ","v":[["habit","習慣","任務","機會"],["research","研究","休息","比賽"],["daily","每天的","昂貴的","地方的"],["focus","專注","減少","懷疑"],["progress","進步","題目","過去"]],"r":[["Main idea means ___.","the message of the whole passage","one minor number","an unrelated opinion"],["For a detail question, first ___.","find evidence in the passage","guess from experience","translate every word"],["'She did not claim everyone improved equally' means ___.","improvement may differ","no one improved","everyone improved equally"]]},{"t":"W7-2 閱讀測驗Ⅱ","v":[["suggest","建議","堅持","購買"],["possible","可能的","完全的","相同的"],["prefer","偏好","完成","解釋"],["solution","解決方案","觀察","主題"],["effective","有效的","昂貴的","普通的"]],"r":[["Inference should be ___.","supported by the passage","based only on personal experience","always certain"],["'The staff did not know which change helped most' means ___.","the cause is uncertain","only one activity worked","nothing changed"],["The director recommends ___.","testing different ideas","using only printed books","ending discussion groups"]]}];
const $=id=>document.getElementById(id);let questions=[],answers=[],at=0,chosen=-1,startedAt=0;
LESSONS.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.t;$('lesson').appendChild(o)});
function build(){const s=LESSONS[Number($('lesson').value)];questions=[...s.v.map(a=>({q:'「'+a[0]+'」的意思是？',opts:a.slice(1),correct:0,kind:'v'})),...s.r.map(a=>({q:a[0],opts:a.slice(1),correct:0,kind:'r'}))];questions=questions.map((q,idx)=>{const order=[0,1,2].sort((a,b)=>((a*3+idx*7)%5)-((b*3+idx*7)%5));return {...q,opts:order.map(i=>q.opts[i]),correct:order.indexOf(0)}});answers=[];at=0;chosen=-1;startedAt=Date.now();$('outcome').hidden=true;$('area').hidden=false;show()}
function show(){const x=questions[at];chosen=-1;$('heading').textContent='第 '+(at+1)+' / 8 題 · '+(x.kind==='v'?'單字':'規則');$('question').textContent=x.q;$('answers').replaceChildren();x.opts.forEach((a,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{chosen=i;[...$('answers').children].forEach((e,j)=>e.classList.toggle('chosen',j===i));$('next').disabled=false};$('answers').appendChild(b)});$('next').disabled=true;$('next').textContent=at===7?'查看結果':'下一題';$('status').textContent='進度：'+(at+1)+' / 8'}
function finish(){const s=LESSONS[Number($('lesson').value)];const correct=questions.map((x,i)=>answers[i]===x.correct);const v=correct.slice(0,5).filter(Boolean).length,r=correct.slice(5).filter(Boolean).length,total=v+r;const elapsed=Math.ceil((Date.now()-startedAt)/60000);$('area').hidden=true;$('outcome').hidden=false;$('grade').textContent=s.t+'：單字 '+v+'/5、規則 '+r+'/3，總分 '+total+'/8（約 '+elapsed+' 分鐘）';$('advice').textContent=total>=7?'已基本記住；下堂課抽查兩題。':total>=5?'部分記住；下堂課前先看錯題。':'需要補強；重新閱讀例句與短文，再作答。';$('details').replaceChildren();questions.forEach((x,i)=>{const p=document.createElement('p');p.textContent=(correct[i]?'✓ ':'✗ ')+(i+1)+'. '+x.q+'｜答案：'+x.opts[x.correct]+(correct[i]?'':'｜你的答案：'+x.opts[answers[i]]);$('details').appendChild(p)});$('copy').onclick=()=>{const t=$('grade').textContent+'\n'+$('advice').textContent;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>$('copy').textContent='已複製').catch(()=>window.prompt('請複製下方文字',t))}else{window.prompt('請複製下方文字',t)}};$('outcome').scrollIntoView({behavior:'smooth'})}
$('next').onclick=()=>{if(chosen<0)return;answers.push(chosen);if(at===7)finish();else{at++;show()}};$('start').onclick=build;
</script></body></html>
