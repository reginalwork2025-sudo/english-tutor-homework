<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>W5｜15 分鐘課後複習</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f5f8f6;color:#203b34}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:0 auto;padding:32px 16px 68px}.top{font-size:12px;color:#567e71;letter-spacing:.14em;font-weight:700}h1{margin:9px 0 5px;font-size:clamp(25px,5vw,36px)}h2{font-size:21px}h3{font-size:17px;margin:0 0 9px}p{line-height:1.6}.muted{color:#60726a}.card{background:white;border-radius:17px;border:1px solid #d8e5dc;padding:20px;margin:16px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #b7cebf;border-radius:10px;padding:10px 14px;background:#fff;color:#244e3c;cursor:pointer}button.active,button.primary{background:#215c44;color:white}button:focus-visible,textarea:focus-visible{outline:3px solid #c79d50;outline-offset:2px}.choice{display:block;text-align:left;width:100%;margin:8px 0}.choice[aria-pressed=true]{border-color:#23644b;background:#e9f4ee}.choice.correct{border-color:#438664;background:#e5f5e8}.choice.incorrect{border-color:#c17163;background:#fff0ee}.question{padding:16px 0;border-bottom:1px solid #e0ebe3}.question:last-child{border-bottom:0}.explanation{padding:12px 14px;background:#f2f7f2;border-radius:9px;font-size:14px;line-height:1.65;margin:7px 0}.hide{display:none}.result{border-top:1px solid #dce7dd;padding-top:16px;margin-top:16px}textarea{width:100%;min-height:120px;border:1px solid #b8ccbc;border-radius:10px;padding:13px;font:inherit;resize:vertical}.score{font-size:25px;font-weight:750}.small{font-size:13px}a{color:#23624b}@media(max-width:560px){.card{padding:15px}}
</style></head><body><main>
<div class="top">ENGLISH TUTOR · EXAM 2027 · WEEK 05</div><h1>15 分鐘課後複習</h1><p class="muted">兩堂各自獨立測驗。5 題單字＋3 題 Grammar，確認今天的單字和規則有沒有記住。</p>
<div class="card"><div class="controls"><button id="lesson0" class="active" aria-pressed="true">W5-1｜動名詞</button><button id="lesson1" aria-pressed="false">W5-2｜名詞子句</button></div><p id="lessonName"></p><p class="small muted">建議分配：3 分鐘回想單字 → 8 分鐘作答 → 4 分鐘檢討。先獨立完成，再查看解析。</p></div>
<div class="card"><h2>課後測驗</h2><p class="muted" id="progress" aria-live="polite"></p><div id="questions"></div><div class="controls"><button id="submit" class="primary">批改並顯示解析</button><button id="reset">重新作答</button></div><div id="result" class="result hide" role="status"></div></div>
<div class="card"><h3>我的錯題與規則筆記</h3><textarea id="notes" placeholder="例如：by + reading，因為 by 是介系詞。&#10;I believe that the club can succeed."></textarea><p class="small muted" id="saveStatus">筆記儲存在這台裝置的目前瀏覽器，不會自動上傳給老師。</p><button id="copy">複製本堂結果與筆記</button></div>
<p class="small"><a href="index.html">← 返回 W5 課堂教材</a></p>
<p class="small muted">複習成績不會自動傳給老師。請截圖總分或複製結果回報；避免在共享電腦輸入個人敏感資訊。</p>
</main><script>
'use strict';
const DATA=[{"code":"W5-1","name":"文意選填＋Gerund 動名詞","items":[["v","The reading program was ___ to all local students.",["available","effect","provide"],0,"be 動詞 was 後可接形容詞 available（可參加的／可使用的）。"],["v","The volunteers ___ free books to the students.",["local","provided","effect"],1,"provided 是 provide 的過去式，意思是提供。"],["v","Reading daily can have a positive ___ on your English.",["effect","available","local"],0,"a positive + 名詞：effect（影響）；have an effect on 是常見搭配。"],["v","Many ___ families joined the event.",["provided","experience","local"],2,"local 是形容詞，修飾 families（當地家庭）。"],["v","She had little reading ___ before joining the club.",["experience","available","provide"],0,"reading experience 是閱讀經驗，這裡需要名詞。"],["g","___ English every day helps students learn.",["Read","Reading","Reads"],1,"整段 Reading English every day 當句子的主詞，所以用動名詞 Reading。"],["g","She improved her vocabulary by ___ short stories.",["read","reading","reads"],1,"by 是介系詞，後接動詞要用 V-ing。"],["g","Which sentence uses a gerund as the subject?",["She is reading now.","Reading is useful.","She reads every night."],1,"Reading is useful 的 Reading 是動名詞主詞；is reading 才是進行式。"]]},{"code":"W5-2","name":"搭配詞＋Noun Clause 名詞子句","items":[["v","The students made a final ___ about the project.",["decide","decision","decisive"],1,"make a decision（做決定），decision 是名詞。"],["v","The number of members began to ___.",["increase","increasing","increased"],0,"begin to + 動詞原形；increase 表增加。"],["v","Good friends ___ each other during difficult times.",["support","opportunity","decision"],0,"support 在這裡是動詞，表示支持。"],["v","The club gave students an ___ to try new things.",["increase","challenge","opportunity"],2,"an opportunity to + 原形動詞，表示有機會做某事。"],["v","Finding enough equipment was a real ___.",["challenge","support","increase"],0,"a real + 名詞 challenge（挑戰）。"],["g","I believe ___ the club can succeed.",["despite","that","during"],1,"believe + that + 主詞 + 動詞，that 引導受詞名詞子句。"],["g","In 'She said that the class was ready,' what is the object of 'said'?",["She","that the class was ready","was ready"],1,"整個 that the class was ready 是名詞子句，作 said 的受詞。"],["g","Which sentence is grammatically correct?",["I think that she is helpful.","I think that is she helpful.","I think that she helpful."],0,"that 後是正常敘述句語序：主詞 she + 動詞 is + 形容詞 helpful。"]]}];
const $=x=>document.getElementById(x);
const storage=i=>'exam-2027-w5-review-'+i+'-v1';
let active=0,records=[{a:{},notes:'',graded:false},{a:{},notes:'',graded:false}];
records=records.map((r,i)=>{try{const s=JSON.parse(localStorage.getItem(storage(i))||'null');return s&&typeof s==='object'&&s.a&&typeof s.a==='object'?{a:s.a,notes:typeof s.notes==='string'?s.notes:'',graded:!!s.graded}:r}catch(e){return r}});
function save(){records[active].notes=$('notes').value;try{localStorage.setItem(storage(active),JSON.stringify(records[active]));$('saveStatus').textContent='本堂答案和筆記已自動儲存於此瀏覽器。'}catch(e){$('saveStatus').textContent='無法儲存：請複製筆記，以免關閉頁面後遺失。'}}
function render(){const d=DATA[active],r=records[active];$('lessonName').textContent=d.code+'｜'+d.name;for(let i=0;i<2;i++){$('lesson'+i).classList.toggle('active',active===i);$('lesson'+i).setAttribute('aria-pressed',String(active===i))}
$('questions').replaceChildren();d.items.forEach((item,i)=>{const wrap=document.createElement('section');wrap.className='question';const title=document.createElement('h3');title.textContent=(i+1)+'. '+item[1];const sub=document.createElement('p');sub.className='small muted';sub.textContent=item[0]==='v'?'Vocabulary 單字':'Grammar 文法';wrap.append(sub,title);item[2].forEach((option,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+option;b.setAttribute('aria-pressed',String(r.a[i]===j));if(r.graded&&r.a[i]!==undefined){if(j===item[3])b.classList.add('correct');else if(j===r.a[i])b.classList.add('incorrect')}b.onclick=()=>{if(r.graded)return;r.a[i]=j;save();render()};wrap.appendChild(b)});if(r.graded){const f=document.createElement('div');f.className='explanation';f.textContent=(r.a[i]===item[3]?'✓ 正確。':'✗ 正確答案：'+String.fromCharCode(65+item[3])+'。')+' '+item[4];wrap.appendChild(f)}$('questions').appendChild(wrap)});
$('notes').value=r.notes;$('progress').textContent='已完成 '+Object.keys(r.a).filter(k=>Number(k)>=0&&Number(k)<8).length+'/8 題';$('result').classList.toggle('hide',!r.graded);$('submit').disabled=r.graded;$('submit').textContent=r.graded?'已批改':'批改並顯示解析';if(r.graded)showResult()}
function showResult(){const d=DATA[active],a=records[active].a,correct=d.items.map((item,i)=>a[i]===item[3]);const v=correct.slice(0,5).filter(Boolean).length,g=correct.slice(5).filter(Boolean).length,total=v+g;const msg=total>=7?'已基本記住；下堂課抽查兩題。':total>=5?'部分記住；下堂課先複習錯題。':'需要補強；先重看單字例句和文法規則。';$('result').replaceChildren();const p=document.createElement('p');p.className='score';p.textContent=total+' / 8';const p2=document.createElement('p');p2.textContent='單字 '+v+'/5　｜　Grammar '+g+'/3';const p3=document.createElement('p');p3.textContent=msg;$('result').append(p,p2,p3)}
$('lesson0').onclick=()=>{active=0;render()};$('lesson1').onclick=()=>{active=1;render()};
$('submit').onclick=()=>{if(Object.keys(records[active].a).filter(k=>Number(k)>=0&&Number(k)<8).length<8){$('progress').textContent='請先完成全部 8 題，再提交批改。';return}records[active].graded=true;save();render();$('result').scrollIntoView({behavior:'smooth',block:'center'})};
$('reset').onclick=()=>{if(!confirm('重新作答會清除這一堂的答案及評分，保留筆記。確定嗎？'))return;records[active].a={};records[active].graded=false;save();render()};
$('notes').addEventListener('input',save);
$('copy').onclick=()=>{const d=DATA[active],r=records[active];const ok=d.items.map((item,i)=>r.a[i]===item[3]);const v=ok.slice(0,5).filter(Boolean).length,g=ok.slice(5).filter(Boolean).length;const text=d.code+' 課後複習\n'+(r.graded?'單字 '+v+'/5；Grammar '+g+'/3；合計 '+(v+g)+'/8':'尚未批改')+'\n筆記：\n'+$('notes').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>$('saveStatus').textContent='已複製成績與筆記').catch(()=>window.prompt('請複製',text));else window.prompt('請複製',text)};
render();
</script></body></html>
