<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學測英文 W6｜互動教室</title><style>:root{font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f8f5;color:#243c35}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:0 auto;padding:28px 18px 70px}h1{font-size:clamp(28px,4.6vw,40px);margin:10px 0}h2{font-size:22px}h3{font-size:17px;margin:7px 0}.muted{color:#5b786a}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;color:#527d65}.card{background:white;border:1px solid #dae8de;border-radius:17px;padding:22px;margin:16px 0}.row{display:flex;gap:9px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #b8d0bf;border-radius:9px;padding:10px 14px;font:inherit;background:#fff;color:#245c43}.active,.primary{background:#235d45;color:#fff}.choice{display:block;text-align:left;width:100%;margin:8px 0}.choice[aria-pressed=true]{background:#e6f4e9;border-color:#34805c}.q{padding:16px 0;border-bottom:1px solid #e5ece6}.q:last-child{border:0}.explain{padding:10px;background:#f1f7f1;border-radius:8px;font-size:14px}.rule{border-left:3px solid #65a381;padding:8px 14px;margin:14px 0;background:#f8fbf8}.rule p{white-space:pre-line}.read{white-space:pre-line;background:#f8faf8;border-radius:12px;padding:16px;line-height:1.9}textarea{font:inherit;width:100%;padding:12px;min-height:135px;border:1px solid #bed1c3;border-radius:10px}a{color:#1d6345}.small{font-size:13px}.hidden{display:none}@media(max-width:620px){.card{padding:16px}}</style></head><body><main><div class="eyebrow">EXAM 2027 · WEEK 06</div><h1>W6｜英文互動教室</h1><p class="muted">兩堂各 90 分鐘：單字10分、文法20分、閱讀20分、試題20分、寫作與訂正20分。先教句型，讓學生能分辨每個動詞的作用，再進入長句閱讀。</p><div class="card"><div class="row"><button id="tab0" class="active">W6-1｜to V</button><button id="tab1">W6-2｜Past Perfect</button></div><h2 id="title"></h2><a href="review.html">開啟 15 分鐘課後複習</a></div><div class="card"><h2>① 單字暖身</h2><div id="words"></div></div><div class="card"><h2>② Grammar｜規則與例句</h2><div id="rules"></div></div><div class="card"><h2>③ Reading｜原創閱讀</h2><p class="muted">先用 5–6 分鐘獨立閱讀，劃出主詞、主要動詞與時間／目的線索，再用英文回答。</p><p class="read" id="reading"></p></div><div class="card"><h2>④ 閱讀與文法檢核｜12 題</h2><p class="muted small">先獨立選答案；全部完成後批改，逐題顯示理由。</p><div id="questions"></div><div class="row"><button class="primary" id="submit">批改並顯示解析</button><button id="reset">重新作答</button></div><p id="result" aria-live="polite"></p></div><div class="card"><h2>⑤ 寫作輸出</h2><div id="writing"></div><textarea id="writingAnswer" placeholder="在這裡完成句子；可以與老師討論修改。"></textarea></div><div class="card"><h2>⑥ 老師補充／學生筆記</h2><textarea id="notes" placeholder="記錄不懂的字、老師補充的例句、錯題規則……"></textarea><p class="muted small" id="status">本裝置瀏覽器自動儲存。成績不會自動傳送給老師。</p><button id="copy">複製成績及筆記</button></div><p class="small"><a href="../../index.html">← 返回學測英文總入口</a></p></main><script>
const DATA=[{"title":"W6-1｜To-infinitive：to V 的不同用法","words":[["purpose","目的"],["decide","決定"],["prepare","準備"],["opportunity","機會"],["necessary","必要的"],["improve","改善／進步"],["promise","承諾"],["refuse","拒絕"]],"rules":[["① 當名詞：to V 作主詞／補語","To learn English takes time.（學英文需要時間）｜My goal is to improve my English.（我的目標是進步）","與 It is important to practice every day. 比較：It 是形式主詞，真正動作是 to practice。"],["② 修飾名詞：N + to V","I have homework to finish.（有作業要完成）｜She needs a place to study.（需要讀書的地方）","to V 補充說明前面的名詞：要完成的作業、可以讀書的地方。"],["③ 表示目的：to V = in order to V","She went to the library to study.（她去圖書館是為了讀書）","問 Why? → To study. 可以放在句尾，表示行為目的。"],["④ 常見動詞 + to V","want to learn / decide to join / hope to improve / plan to visit / promise to help / refuse to leave","不同動詞後面的形式不同：enjoy reading，但 want to read。"],["⑤ It is + adj. + to V / too ... to / enough to","It is important to listen.｜The box is too heavy to carry.｜He is old enough to drive.","too ... to 通常表示太……而不能；adj. enough to 表示足夠……去做。"],["⑥ 受詞後接 to V","The teacher asked us to read.｜My parents allowed me to go.","ask / tell / want / allow + 人 + to V；但是 make / let / help + 人 + V 原形（help 也可用 to V）。"],["易錯比較：to 是不定詞還是介系詞？","I want to read.（to + 原形動詞）｜I look forward to reading.（to 是介系詞，後接 V-ing）","不是看到 to 都選原形；要看是不是介系詞片語。"]],"reading":"Last month, the school decided to open a quiet study room for students. The teachers wanted to create a place to read and prepare for exams. To make the room useful, they asked students to suggest rules. Some students hoped to work in groups, while others preferred to study alone. The school divided the room into two areas to meet both needs. It was important to listen to different opinions. The plan also gave students an opportunity to learn how to respect others.","questions":[["Why did the school open a study room?",["To help students study and prepare for exams.","To sell books.","To organize a sports competition."],0,"wanted to create a place to read and prepare for exams"],["What did teachers ask students to do?",["Suggest rules.","Buy equipment.","Close the room."],0,"asked students to suggest rules"],["Why was the room divided into two areas?",["To meet different needs.","Because it was too small.","To stop all conversations."],0,"to meet both needs = 表目的"],["What does 'It was important to listen' mean?",["Listening was important.","Teachers were listening then.","Listening had already finished."],0,"It is important to V：形式主詞句型"],["She went to the library ___ for an exam.",["to study","studying","study"],0,"表示目的：go ... to study"],["I have three emails ___ today.",["to write","writing","wrote"],0,"emails to write：不定詞修飾名詞"],["They decided ___ a new club.",["to start","starting","start"],0,"decide + to V"],["The teacher asked us ___ quietly.",["to read","reading","read"],0,"ask + 人 + to V"],["My goal is ___ my speaking.",["to improve","improving yesterday","improved"],0,"to V 作主詞補語，解釋目標"],["I look forward to ___ you.",["meeting","meet","met"],0,"look forward to 的 to 是介系詞"],["The bag was too heavy ___ alone.",["to carry","carrying","carry"],0,"too + adj. + to V"],["Which sentence describes a purpose?",["She saved money to buy a bike.","She enjoys riding a bike.","The bike is red."],0,"to buy = 為了購買"]],"writing":["用 I want to ... / I decided to ... 各造一句。","用『目的 to V』與『名詞 + to V』各造一句。","用 It is important to ... 表達一個學習建議。"]},{"title":"W6-2｜Past Perfect：過去完成式與時間先後","words":[["arrive","到達"],["leave","離開"],["realize","意識到"],["complete","完成"],["cancel","取消"],["already","已經"],["before","在……之前"],["by the time","到了……的時候"]],"rules":[["① 三種時態比較","Present: I finish my homework.｜Past Simple: I finished it at 8.｜Past Perfect: I had finished it before Mom came home.","Past Perfect = had + Vpp（過去分詞），所有主詞都用 had。"],["② 過去的過去","When I arrived, the train had left.（我到的時候，火車早已離開）","火車先離開 had left → 我後到 arrived。"],["③ before / after / by the time","By the time we arrived, the film had started.｜After she had finished her homework, she went out.","比較兩件過去事件的先後順序；有 before/after 時，若順序清楚也常用過去簡單式。"],["④ had + Vpp 常見不規則變化","go–went–gone；see–saw–seen；eat–ate–eaten；write–wrote–written；leave–left–left；finish–finished–finished","不要寫 had went、had ate；必須 had + 過去分詞。"],["⑤ 疑問與否定","Had she finished before class?｜She had not (hadn't) finished when class began.","Had + 主詞 + Vpp?；hadn't + Vpp。"],["⑥ 與過去進行式比較","I was studying when he called.（當時正在讀）｜I had studied before he called.（之前已讀過）","was/were + V-ing = 當時進行；had + Vpp = 較早已完成。"],["⑦ 先找時間線，再選時態","First: students submitted the plan. → Later: the principal announced the decision. → The students had submitted the plan before the principal announced the decision.","不是每句過去都要用 had；兩件過去事件有明確先後、且要強調較早事件時再用。"]],"reading":"On Monday morning, Mia arrived at school and realized that she had left her science project at home. She had completed the project the night before, so she was worried about missing the deadline. By the time the first class began, her father had already found the project on her desk. He brought it to school during lunch. Mia thanked him and promised to check her bag every night. She learned that preparing early was helpful, but checking everything before leaving was just as important.","questions":[["When had Mia completed her project?",["The night before.","During lunch.","After the first class."],0,"had completed ... the night before"],["What had Mia left at home?",["Her science project.","Her lunch.","Her school uniform."],0,"had left her science project at home"],["What happened before the first class began?",["Her father had found the project.","Mia bought a new project.","The deadline was canceled."],0,"By the time ... began, ... had already found"],["What lesson did Mia learn?",["Check her bag before leaving.","Never do science projects.","Arrive late to school."],0,"promised to check her bag every night"],["When I arrived, the bus ___ already left.",["had","has","was"],0,"had + left（Vpp）"],["She ___ her work before the meeting started.",["had finished","has finish","was finish"],0,"較早完成：had finished"],["Which sentence means the train left first?",["The train had left when I arrived.","The train leaves tomorrow.","I was leaving when the train arrived."],0,"had left 表示比 arrived 更早"],["He ___ eaten before the game.",["had","was","did"],0,"had eaten，eat–ate–eaten"],["By the time we got home, it ___ raining.",["had stopped","have stopped","stopping"],0,"主句事件發生前已停止"],["At 8 p.m. yesterday, I ___ TV.",["was watching","had watched","will watch"],0,"8 p.m. 當時正在做 → 過去進行式"],["Which is correct?",["She had gone home.","She had went home.","She had go home."],0,"go–went–gone"],["After they ___ the report, they sent it.",["had written","had wrote","writing"],0,"had written（write–wrote–written）"]],"writing":["用 before 或 by the time 寫一個『先發生 A、後發生 B』的句子。","寫一句 Past Simple + Past Perfect，並註明兩個事件的先後順序。","比較 I was studying ... 與 I had studied ...，各造一句。"]}],REV=false,$=s=>document.getElementById(s);let ix=0;
const key=i=>'exam2027-w6-'+(REV?'review-':'lesson-')+i+'-v1';
const states=[0,1].map(i=>{try{const v=JSON.parse(localStorage.getItem(key(i))||'null');return v&&v.a?{a:v.a,graded:!!v.graded,notes:v.notes||'',writing:v.writing||''}:{a:{},graded:false,notes:'',writing:''}}catch(e){return {a:{},graded:false,notes:'',writing:''}}});
function save(){const s=states[ix];s.notes=$('notes').value;if(!REV)s.writing=$('writingAnswer').value;try{localStorage.setItem(key(ix),JSON.stringify(s))}catch(e){$('status').textContent='本機儲存失敗，請複製筆記。'}}
function render(){const d=DATA[ix],s=states[ix],items=REV?[...d.questions.slice(4,9),...d.questions.slice(9,12)]:d.questions;
$('title').textContent=d.title;for(let i=0;i<2;i++){$('tab'+i).classList.toggle('active',ix===i);$('tab'+i).setAttribute('aria-pressed',String(ix===i))}
if(!REV){$('words').replaceChildren();d.words.forEach(([w,meaning])=>{const el=document.createElement('details'),head=document.createElement('summary'),p=document.createElement('p');head.textContent=w;p.textContent=meaning;el.append(head,p);$('words').append(el)});$('rules').replaceChildren();d.rules.forEach(([title,example,tip])=>{const el=document.createElement('section'),h=document.createElement('h3'),p=document.createElement('p'),detail=document.createElement('details'),summary=document.createElement('summary'),note=document.createElement('p');el.className='rule';h.textContent=title;p.textContent=example;summary.textContent='老師說明與容易錯的地方';note.textContent=tip;detail.append(summary,note);el.append(h,p,detail);$('rules').append(el)});$('reading').textContent=d.reading;$('writing').replaceChildren();d.writing.forEach((v,i)=>{const p=document.createElement('p');p.textContent=(i+1)+'. '+v;$('writing').append(p)});$('writingAnswer').value=s.writing}
$('questions').replaceChildren();items.forEach((q,i)=>{const section=document.createElement('section'),h=document.createElement('h3');section.className='q';h.textContent=(i+1)+'. '+q[0];section.append(h);q[1].forEach((choice,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+choice;b.setAttribute('aria-pressed',String(s.a[i]===j));b.onclick=()=>{if(s.graded)return;s.a[i]=j;save();render()};section.append(b)});if(s.graded){const p=document.createElement('p');p.className='explain';p.textContent=(s.a[i]===q[2]?'✓ 正確。':'✗ 正解 '+String.fromCharCode(65+q[2])+'。')+q[3];section.append(p)}$('questions').append(section)});
$('notes').value=s.notes;$('submit').disabled=s.graded;const correct=items.filter((q,i)=>s.a[i]===q[2]).length;$('result').textContent=s.graded?'得分：'+correct+' / '+items.length+(REV?'（單字／句子 5 題＋文法 3 題）':''):'';
}
for(let i=0;i<2;i++)$('tab'+i).onclick=()=>{ix=i;render()};
$('submit').onclick=()=>{const n=REV?8:12;if(Object.keys(states[ix].a).length<n){$('result').textContent='請先完成 '+n+' 題再提交。';return}states[ix].graded=true;save();render()};
$('reset').onclick=()=>{if(!confirm('重新作答會清除本堂答案與分數，筆記保留。確定嗎？'))return;states[ix].a={};states[ix].graded=false;save();render()};
$('notes').addEventListener('input',save);if(!REV)$('writingAnswer').addEventListener('input',save);
$('copy').onclick=()=>{const d=DATA[ix],s=states[ix],qs=REV?[...d.questions.slice(4,9),...d.questions.slice(9,12)]:d.questions,correct=qs.filter((q,i)=>s.a[i]===q[2]).length,t=d.title+'\n'+(s.graded?'分數：'+correct+'/'+qs.length:'未批改')+'\n筆記：'+s.notes+(REV?'':'\n寫作：'+s.writing);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>$('status').textContent='已複製').catch(()=>prompt('請複製',t));else prompt('請複製',t)};
render();
</script></body></html>
