<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>W1｜互動課堂教材</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#233c34;font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}main{max-width:920px;margin:auto;padding:28px 16px 72px}h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}.muted{color:#587064}.card{padding:22px;margin:18px 0;border:1px solid #dae5de;border-radius:18px;background:white}.row{display:flex;flex-wrap:wrap;gap:10px}button{cursor:pointer;border:1px solid #aec9bb;border-radius:9px;background:white;color:#205943;padding:10px 14px;font:inherit}.active,.primary{background:#205943;color:white}.choice{display:block;text-align:left;width:100%;margin:7px 0}.choice[aria-pressed=true]{background:#dfefe7}.q{padding:14px 0;border-bottom:1px solid #dce9e0}.chip{display:inline-block;background:#e6f1ea;border-radius:30px;padding:5px 12px;margin:4px}.read{background:#f5faf6;padding:15px;border-radius:9px;line-height:1.85}textarea{width:100%;min-height:135px;border:1px solid #b5cbbf;border-radius:10px;padding:12px;font:inherit}a{color:#23664b}.good{color:green}.bad{color:#a33}.small{font-size:13px}</style></head><body><main><div class="muted small">ENGLISH TUTOR · EXAM 2027</div><h1>Week 1｜互動教室</h1><p>沿用 Canva 課程內容製作互動複習。90 分鐘：暖身10分、規則15分、閱讀20分、測驗20分、筆記訂正25分。</p><div class="card"><div class="row"><button id="tab0">W1-1</button><button id="tab1">W1-2</button></div><h2 id="title"></h2><p id="topic"></p><a id="canva" target="_blank" rel="noopener noreferrer">查看原始 Canva 完整簡報</a></div><div class="card"><h2>① Vocabulary 暖身</h2><div id="vocab"></div><h2>② Grammar 規則</h2><ul id="rules"></ul><h2>③ Reading 閱讀</h2><p class="read" id="reading"></p><p class="muted small">此為依原教材主題改寫的精簡短文；原始閱讀全文請查看 Canva。</p></div><div class="card"><h2>④ 互動題目</h2><div id="quiz"></div><div class="row"><button class="primary" id="grade">批改與解析</button><button id="reset">重新作答</button></div><strong id="score" aria-live="polite"></strong></div><div class="card"><h2>⑤ 課堂筆記區</h2><textarea id="notes" placeholder="記下不熟的單字、規則或老師補充的例句"></textarea><p class="muted small">此瀏覽器自動保存，不會自動傳給老師。</p><button id="copy">複製筆記及結果</button></div><p><a href="review.html">前往 15 分鐘課後複習 →</a></p></main><script>const W=1,REVIEW=false,DATA=[["Vocabulary Review + Simple Tenses","sfyy59tf1hm7axb","單字總複習與現在／過去／未來簡單式",["tourist","gear","protect","improve","organize"],["現在簡單式：習慣。","過去簡單式：yesterday、last week。","未來簡單式：will + 原形動詞。"],"A tourist visited the coast last year and saw a coral reef. Local people work to protect the ocean. They organize events and encourage people to reduce trash. Next year, the town will provide more activities.",[["A ___ travels for fun.",["tourist","gear","reef"],0,"tourist 旅客"],["We use diving ___ underwater.",["gear","trash","policy"],0,"gear 裝備"],["We should ___ the sea.",["protect","protected","protecting"],0,"should + 原形"],["She wants to ___ her English.",["improve","improved","improving"],0,"want to + 原形"],["They ___ an event last week.",["organized","organize","will organize"],0,"last week → 過去式"],["She ___ English every day.",["studies","study yesterday","will studied"],0,"一般現在式"],["He ___ his friend yesterday.",["met","meet","will meet"],0,"過去式"],["Tomorrow we ___ a lesson.",["will start","started","starts yesterday"],0,"未來式"]]],["When Sandwiches Are Not So Simple","wppayi5he87uzvd","B2 閱讀、長句找主詞動詞",["convenience","humble","gourmet","ingredient","attractive"],["先找 S + V，再處理補充資訊。","attract(V) / attractive(Adj) / attraction(N)。","先掌握主旨，再找證據。"],"Sandwiches used to be seen as simple convenience food. Today, some chefs make gourmet sandwiches with carefully chosen ingredients. People pay more for unusual combinations and high-quality food. A humble lunch can become an attractive choice.",[["A gourmet meal is ___.",["high-quality","dangerous","empty"],0,"gourmet"],["A ___ sandwich is ordinary.",["humble","gourmet","Michelin-starred"],0,"humble"],["Chefs choose fresh ___.",["ingredients","attraction","registration"],0,"食材"],["A quick sandwich is ___ food.",["convenience","oversleep","soaked"],0,"convenience food"],["The café is ___.",["attractive","attraction","attract"],0,"形容詞"],["What is a sarnie?",["An informal word for sandwich","A drink","A tool"],0,"英式口語"],["Which is a noun?",["attraction","attractive","attract"],0,"attraction"],["Which has S+V?",["The chef made lunch.","With fresh food.","An expensive lunch."],0,"chef + made"]]]];let ix=0,$=id=>document.getElementById(id),storage=j=>'exam2027-week-'+W+'-'+(REVIEW?'review-':'lesson-')+j,state=[0,1].map(j=>{try{return JSON.parse(localStorage.getItem(storage(j)))||'{"a":{},"notes":"","graded":false}')}catch{return {a:{},notes:'',graded:false}}});function save(){state[ix].notes=$('notes').value;try{localStorage.setItem(storage(ix),JSON.stringify(state[ix]))}catch{}}function draw(){const d=DATA[ix],s=state[ix];$('tab0').classList.toggle('active',ix===0);$('tab1').classList.toggle('active',ix===1);$('title').textContent=d[0];$('notes').value=s.notes;if(!REVIEW){$('canva').href='https://canva.link/'+d[1];$('topic').textContent=d[2];$('vocab').replaceChildren();d[3].forEach(x=>{let el=document.createElement('span');el.className='chip';el.textContent=x;$('vocab').append(el)});$('rules').replaceChildren();d[4].forEach(x=>{let li=document.createElement('li');li.textContent=x;$('rules').append(li)});$('reading').textContent=d[5]}$('quiz').replaceChildren();d[6].forEach((q,i)=>{let sec=document.createElement('section');sec.className='q';let head=document.createElement('strong');head.textContent=(i+1)+'. '+q[0];sec.append(head);q[1].forEach((op,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+op;b.setAttribute('aria-pressed',String(s.a[i]===j));b.onclick=()=>{if(s.graded)return;s.a[i]=j;save();draw()};sec.append(b)});if(s.graded){let p=document.createElement('p');p.className=s.a[i]===q[2]?'good':'bad';p.textContent=(s.a[i]===q[2]?'✓ 正確':'✗ 正解：'+String.fromCharCode(65+q[2]))+'。'+q[3];sec.append(p)}$('quiz').append(sec)});$('grade').disabled=!!s.graded;$('score').textContent=s.graded?'得分：'+d[6].filter((q,i)=>s.a[i]===q[2]).length+'/8':''}for(let i=0;i<2;i++)$('tab'+i).onclick=()=>{ix=i;draw()};$('grade').onclick=()=>{if(Object.keys(state[ix].a).length<8){$('score').textContent='請先完成全部 8 題';return}state[ix].graded=true;save();draw()};$('reset').onclick=()=>{if(!confirm('重新作答？筆記保留。'))return;state[ix].a={};state[ix].graded=false;save();draw()};$('notes').oninput=save;$('copy').onclick=()=>{let t='W'+W+'-'+(ix+1)+' '+$('score').textContent+'\n'+$('notes').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(()=>prompt('請複製',t));else prompt('請複製',t)};draw();</script></body></html>
