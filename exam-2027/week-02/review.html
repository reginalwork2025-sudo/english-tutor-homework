<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>W2｜15 分鐘複習</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#233c34;font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}main{max-width:920px;margin:auto;padding:28px 16px 72px}h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}.muted{color:#587064}.card{padding:22px;margin:18px 0;border:1px solid #dae5de;border-radius:18px;background:white}.row{display:flex;flex-wrap:wrap;gap:10px}button{cursor:pointer;border:1px solid #aec9bb;border-radius:9px;background:white;color:#205943;padding:10px 14px;font:inherit}.active,.primary{background:#205943;color:white}.choice{display:block;text-align:left;width:100%;margin:7px 0}.choice[aria-pressed=true]{background:#dfefe7}.q{padding:14px 0;border-bottom:1px solid #dce9e0}.chip{display:inline-block;background:#e6f1ea;border-radius:30px;padding:5px 12px;margin:4px}.read{background:#f5faf6;padding:15px;border-radius:9px;line-height:1.85}textarea{width:100%;min-height:135px;border:1px solid #b5cbbf;border-radius:10px;padding:12px;font:inherit}a{color:#23664b}.good{color:green}.bad{color:#a33}.small{font-size:13px}</style></head><body><main><div class="muted small">ENGLISH TUTOR · EXAM 2027</div><h1>Week 2｜15 分鐘課後複習</h1><p>5 題單字／文章理解＋3 題句型應用。建議 3 分鐘回想、8 分鐘作答、4 分鐘訂正。</p><div class="card"><div class="row"><button id="tab0">W2-1</button><button id="tab1">W2-2</button></div><h2 id="title"></h2></div><div class="card"><h2>課後測驗</h2><div id="quiz"></div><div class="row"><button class="primary" id="grade">批改與解析</button><button id="reset">重新作答</button></div><strong id="score" aria-live="polite"></strong></div><div class="card"><h2>錯題筆記區</h2><textarea id="notes" placeholder="記下不熟的單字、規則或老師補充的例句"></textarea><p class="muted small">此瀏覽器自動保存，不會自動傳給老師。</p><button id="copy">複製筆記及結果</button></div><p><a href="index.html">← 返回本週上課教材</a></p></main><script>const W=2,REVIEW=true,DATA=[["Adjectives and Adverbs","tj0jfzlas3josg8","形容詞、副詞與位置",["careful","carefully","quiet","often","delicious"],["Adj：名詞前或連綴動詞後。","Adv：修飾動詞、形容詞或副詞。","often 通常放一般動詞前。"],"A new student joined the class. She was quiet but friendly. She listened carefully and usually arrived early. The teacher thought she was a careful student. She answered questions clearly and felt happy.",[["She is a ___ student.",["careful","carefully","care"],0,"形容詞"],["She reads ___.",["carefully","careful","care"],0,"副詞"],["He is a ___ boy.",["quiet","quietly","quietness"],0,"Adj"],["She ___ studies at night.",["often","friendly","careful"],0,"頻率副詞"],["The cake tastes ___.",["delicious","deliciously","delight"],0,"連綴動詞後形容詞"],["He speaks English ___.",["clearly","clear","clearness"],0,"修飾 speaks"],["Which is a noun?",["happiness","happy","happily"],0,"happiness"],["She ___ tired.",["looks","look carefully","looking"],0,"looks + Adj"]]],["Suffix and Word Family","tgzkoc5w4pkmv9r","字尾、字族與詞性",["decision","information","development","successful","successfully"],["-tion / -ment / -ness 常形成名詞。","-ful / -ive 常形成形容詞。","-ly 常形成副詞，但 friendly 是形容詞。"],"A school started a creative project. The students made an important decision and collected information. Their plan required careful development. They worked successfully. Their success encouraged other students.",[["They made a ___.",["decision","decide","decisive"],0,"名詞"],["We need more ___.",["information","inform","informative"],0,"information"],["The project showed ___.",["development","develop","developing"],0,"名詞"],["The team was ___.",["successful","successfully","success"],0,"形容詞"],["She worked ___.",["successfully","successful","success"],0,"副詞"],["Which suffix forms nouns?",["-ness","-ly","-ful"],0,"kindness"],["Which is adjective?",["creative","creation","create"],0,"creative"],["Which is Adj → Adv?",["careful → carefully","happy → happiness","develop → development"],0,"-ly"]]]];let ix=0,$=id=>document.getElementById(id),storage=j=>'exam2027-week-'+W+'-'+(REVIEW?'review-':'lesson-')+j,state=[0,1].map(j=>{try{return JSON.parse(localStorage.getItem(storage(j)))||'{"a":{},"notes":"","graded":false}')}catch{return {a:{},notes:'',graded:false}}});function save(){state[ix].notes=$('notes').value;try{localStorage.setItem(storage(ix),JSON.stringify(state[ix]))}catch{}}function draw(){const d=DATA[ix],s=state[ix];$('tab0').classList.toggle('active',ix===0);$('tab1').classList.toggle('active',ix===1);$('title').textContent=d[0];$('notes').value=s.notes;if(!REVIEW){$('canva').href='https://canva.link/'+d[1];$('topic').textContent=d[2];$('vocab').replaceChildren();d[3].forEach(x=>{let el=document.createElement('span');el.className='chip';el.textContent=x;$('vocab').append(el)});$('rules').replaceChildren();d[4].forEach(x=>{let li=document.createElement('li');li.textContent=x;$('rules').append(li)});$('reading').textContent=d[5]}$('quiz').replaceChildren();d[6].forEach((q,i)=>{let sec=document.createElement('section');sec.className='q';let head=document.createElement('strong');head.textContent=(i+1)+'. '+q[0];sec.append(head);q[1].forEach((op,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+op;b.setAttribute('aria-pressed',String(s.a[i]===j));b.onclick=()=>{if(s.graded)return;s.a[i]=j;save();draw()};sec.append(b)});if(s.graded){let p=document.createElement('p');p.className=s.a[i]===q[2]?'good':'bad';p.textContent=(s.a[i]===q[2]?'✓ 正確':'✗ 正解：'+String.fromCharCode(65+q[2]))+'。'+q[3];sec.append(p)}$('quiz').append(sec)});$('grade').disabled=!!s.graded;$('score').textContent=s.graded?'得分：'+d[6].filter((q,i)=>s.a[i]===q[2]).length+'/8':''}for(let i=0;i<2;i++)$('tab'+i).onclick=()=>{ix=i;draw()};$('grade').onclick=()=>{if(Object.keys(state[ix].a).length<8){$('score').textContent='請先完成全部 8 題';return}state[ix].graded=true;save();draw()};$('reset').onclick=()=>{if(!confirm('重新作答？筆記保留。'))return;state[ix].a={};state[ix].graded=false;save();draw()};$('notes').oninput=save;$('copy').onclick=()=>{let t='W'+W+'-'+(ix+1)+' '+$('score').textContent+'\n'+$('notes').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(()=>prompt('請複製',t));else prompt('請複製',t)};draw();</script></body></html>
