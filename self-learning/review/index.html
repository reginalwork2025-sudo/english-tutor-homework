<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Self Learning · Vocabulary Bank</title><style>body{font:16px system-ui;background:#f4f8f7;color:#173940;max-width:850px;margin:auto;padding:20px}main{background:white;padding:22px;border-radius:16px}input,select,button{padding:10px;border:1px solid #c9d8d8;border-radius:8px;margin:4px}button{cursor:pointer}li{padding:8px;border-bottom:1px solid #e5eeee}a{color:#246777}</style><main><a href="../whale-falls/index.html">← Whale Falls 閱讀</a><h1>Vocabulary Bank｜單字銀行</h1><p>跨文章共用。單字與熟悉度儲存在此瀏覽器；可匯出 JSON 備份。</p><input id="q" placeholder="搜尋單字／中文"><input id="w" placeholder="English"><input id="m" placeholder="中文"><button id="add">新增</button><button id="export">匯出備份</button><input id="import" type="file" accept=".json"><p id="count"></p><ul id="list"></ul></main><script>const defaults=[["scavenger","食腐動物"],["carcass","屍體"],["sediment","沉積物"],["sustain","維持"],["biodiversity","生物多樣性"],["deplete","耗盡"],["extinction debt","滅絕債務"],["blubber","鯨脂"],["lipid","脂質"],["buoyancy","浮力"],["vertebra","脊椎骨"],["vulnerable","脆弱的"],["entanglement","纏繞"],["rebound","恢復"],["secrete","分泌"],["morsel","一小塊食物"],["decimate","大量毀滅"],["conjure","喚起"],["serendipitously","偶然地"],["symbiosis","共生"]].map(([word,meaning])=>({word,meaning,status:"new"}));const key="english-tutor-vocabulary-v1";let data;try{data=JSON.parse(localStorage.getItem(key))||defaults}catch{data=defaults}function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){list.replaceChildren();const q=document.getElementById("q").value.toLowerCase();data.filter(x=>(x.word+x.meaning).toLowerCase().includes(q)).forEach(x=>{const li=document.createElement("li");const label=document.createElement("span");label.textContent=x.word+" — "+x.meaning+" ";const s=document.createElement("select");[["new","待學習"],["learning","學習中"],["known","已掌握"]].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;s.append(o)});s.value=x.status;s.onchange=()=>{x.status=s.value;save()};const b=document.createElement("button");b.textContent="刪除";b.onclick=()=>{data=data.filter(y=>y!==x);save();render()};li.append(label,s,b);list.append(li)});count.textContent="共 "+data.length+" 字，已掌握 "+data.filter(x=>x.status==="known").length+" 字"}document.getElementById("q").oninput=render;document.getElementById("add").onclick=()=>{if(!w.value.trim()||!m.value.trim())return alert("請輸入單字與意思");if(data.some(x=>x.word.toLowerCase()===w.value.trim().toLowerCase()))return alert("已存在");data.push({word:w.value.trim(),meaning:m.value.trim(),status:"new"});w.value=m.value="";save();render()};document.getElementById("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="vocabulary.json";a.click()};document.getElementById("import").onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>typeof x.word==="string"&&typeof x.meaning==="string"))throw 0;data=a;save();render()}catch{alert("格式不正確")}};render()</script></html>
