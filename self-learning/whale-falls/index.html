<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale Falls · Self Learning</title><style>body{font:16px system-ui;background:#f3f8f7;color:#183a44;max-width:900px;margin:auto;padding:22px}header,article{background:white;border-radius:15px;padding:22px;margin:15px 0}header{background:#173e49;color:white}a{color:#27868e}header a{color:#bde6e4}button{padding:9px 14px;border:1px solid #b6d2cf;background:#eaf6f2;border-radius:8px;cursor:pointer}.zh{background:#eaf6f2;padding:13px;border-radius:8px}blockquote{border-left:4px solid #8fbeb4;padding-left:12px}small{color:#5a7779}</style><header><h1>Whale Falls｜鯨落</h1><p>23 個閱讀主題・中文理解・英文句型・進度追蹤</p><a href="../review/index.html">單字銀行 →</a></header><article><p>根據 Sarah DeWeerdt 的 Nautilus 文章整理。這是教學摘要與文法導讀，並非逐段原文翻譯。</p><a href="https://nautil.us/the-unseen-deep-sea-legacy-of-whaling-537454" target="_blank" rel="noopener">閱讀文章原文 ↗</a><p id="progress"></p></article><main id="units"></main><script>const data=[["The first arrivals","食腐動物先抵達，依序取食鯨魚遺骸。","First come the sleeper sharks","倒裝句：副詞置前，動詞與主詞順序改變。"],["Whale falls","鯨落是沉入海床的鯨魚遺骸所形成的生態系。","have become","現在完成式：過去開始，影響延續至今。"],["Discovery","科學家偶然發現鯨落，並持續記錄物種。","species that live there","that 關係子句修飾 species。"],["Industrial whaling","工業捕鯨使大型鯨魚數量大幅下降。","may have disappeared","may have + p.p.：對過去的推測。"],["Deep-sea nutrients","一頭鯨魚可為深海提供大量養分。","would otherwise","表示「否則原本會……」。"],["Oil-rich bones","鯨骨中的脂質可支持生物群落數十年。","not only ... but also","平行結構，表示不只……也……。"],["Evolution","鯨落生物的演化與大型鯨魚的歷史相關。","when whales evolved","when 引導時間副詞子句。"],["Whaling history","工廠捕鯨船減少了沉入海床的鯨魚遺骸。","rather than","表示「而不是」。"],["Habitat loss","棲地減少可能造成物種流失。","although","引導讓步子句。"],["North Atlantic","北大西洋的鯨魚減少，可能影響專門物種。","could have driven","could have + p.p.：過去可能造成的結果。"],["Mobile scavengers","可移動的食腐動物較能尋找其他食物來源。","while","可以表示對比。"],["Specialists","高度依賴鯨骨的物種較容易陷入孤立。","dependent on","形容詞片語修飾名詞。"],["Survival models","模型用鯨魚體型和分布推估物種存活。","in order to","表示目的。"],["Unseen losses","未被發現的物種也可能已經消失。","even when","表示「即使在……時」。"],["Osedax worms","食骨蠕蟲依靠共生細菌消化鯨骨脂質。","with no mouth or gut","with 片語描述特徵。"],["Imagined colors","作者想像可能存在但未被發現的物種。","What if","提出假設情境。"],["Duration","鯨落能持續的時間受多種環境條件影響。","depending on","表示取決於。"],["Past oceans","今天的鯨落可能反映很久以前的海洋。","not ... but ...","表示「不是……而是……」。"],["Extinction debt","舊棲地仍在，但未來可能缺少新的棲地。","once","一旦；時間子句常用現在式。"],["Southern Ocean","南大洋可能保有重要的鯨落研究線索。","leading to","分詞片語表示結果。"],["Exploration","調查越晚，可能失去越多生態資訊。","that we could have had","關係子句加過去可能性。"],["Recovery","大型鯨魚恢復緩慢，保育效果需要時間。","can be reversed","情態動詞被動語態。"],["Hope","保護鯨魚也能保護未來的深海生命。","so that","表示目的。"]];const key="whale-falls-completed-v2";let done=JSON.parse(localStorage.getItem(key)||"[]");function progress(){document.getElementById("progress").textContent="已完成 "+done.length+" / "+data.length+" 單元"}data.forEach((x,i)=>{const a=document.createElement("article");const h=document.createElement("h2");h.textContent=(i+1)+". "+x[0];const p=document.createElement("p");p.className="zh";p.textContent=x[1];const b=document.createElement("blockquote");b.textContent=x[2];const g=document.createElement("p");g.textContent=x[3];const label=document.createElement("label");const check=document.createElement("input");check.type="checkbox";check.checked=done.includes(i);check.onchange=()=>{done=check.checked?[...new Set([...done,i])]:done.filter(n=>n!==i);localStorage.setItem(key,JSON.stringify(done));progress()};label.append(check,document.createTextNode(" 完成"));a.append(h,p,b,g,label);units.append(a)});progress()</script></html>
